name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Testes
        run: npm test

      - name: Gerar instalador
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: Enviar instalador (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: projecao-igreja-windows
          path: release/*.exe
          if-no-files-found: error

      # Ao enviar uma tag (ex.: v0.2.0), publica uma Release com o instalador
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
